version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelagent_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/home/user/app/chroma_db
      - ./chat_history.db:/home/user/app/chat_history.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile 
    container_name: travelagent_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITA_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped